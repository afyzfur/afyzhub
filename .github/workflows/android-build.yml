name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Debug, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - name: Upload test reports and exported schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-and-schemas
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: All historical Room upgrades on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload migration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, migrations]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing keystore'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/afyzhub.jks"
          test -s "$RUNNER_TEMP/afyzhub.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/afyzhub.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Resolve version
        run: |
          # 版本号以 build.gradle.kts 为唯一来源，避免两处不一致。
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "无法从 build.gradle.kts 解析 versionName" >&2
            exit 1
          fi
          echo "APP_VERSION=v${VERSION}" >> "$GITHUB_ENV"
          echo "解析到版本 v${VERSION}"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "AfyzHub-${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afyzhub-release
          path: AfyzHub-${{ env.APP_VERSION }}.apk

      - name: Publish prerelease
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AFYZFUR_PAT || github.token }}
        run: |
          # 发行说明写入文件再引用，避免在 YAML 中内嵌多行字符串破坏缩进。
          # 正文取自 CHANGELOG.md 中该版本的段落，使详情页能直接看到更新内容。
          printf 'AfyzHub 开发预览版 %s。此版本用于测试，可能存在未完成的功能。\n\n' \
            "$APP_VERSION" > release-notes.md

          if python3 scripts/extract_changelog.py "$APP_VERSION" >> release-notes.md; then
            echo "已写入 $APP_VERSION 的更新内容"
          else
            # 缺少对应段落时不阻断发布，但要在说明中留下痕迹。
            echo "警告：CHANGELOG.md 中缺少 $APP_VERSION 段落"
            printf '本版本的更新内容尚未记录。\n' >> release-notes.md
          fi

          # 完整历史记录的链接放在最后。
          {
            printf '\n---\n\n'
            printf '全部版本的更新记录见 [CHANGELOG.md](%s)。\n' \
              "https://github.com/afyzfur/afyzhub/blob/main/CHANGELOG.md"
          } >> release-notes.md
          # 同名发行版存在时只覆盖附件与说明，不删除发行版和标签，
          # 避免历史版本连同标签一起丢失。
          if gh release view "$APP_VERSION" >/dev/null 2>&1; then
            echo "发行版 $APP_VERSION 已存在，更新附件与说明"
            gh release edit "$APP_VERSION" \
              --title "$APP_VERSION" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$APP_VERSION" \
              "AfyzHub-${APP_VERSION}.apk" --clobber
          else
            gh release create "$APP_VERSION" \
              --title "$APP_VERSION" \
              --notes-file release-notes.md \
              --prerelease \
              --target main \
              "AfyzHub-${APP_VERSION}.apk"
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/afyzhub.jks"
