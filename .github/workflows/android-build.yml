name: Android CI

on:
  push:
    branches: [ main ]
    # 纯文档改动不触发构建，避免重复重建同一版本的 APK。
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Show failing test details
        if: failure()
        run: |
          # 直接打印 XML 报告里的失败原因，避免另外下载报告。
          find app/build/test-results -name '*.xml' -print0 |
            xargs -0 grep -l '<failure' |
            while read -r f; do
              echo "===== $f ====="
              sed -n 's/.*<testcase name="\([^"]*\)".*/CASE: \1/p;/<failure/,/<\/failure>/p' "$f" | head -40
            done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/afyzhub.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/afyzhub.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Resolve version
        run: |
          # 版本号以 build.gradle.kts 为唯一来源，避免两处不一致。
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "无法从 build.gradle.kts 解析 versionName" >&2
            exit 1
          fi
          echo "APP_VERSION=v${VERSION}" >> "$GITHUB_ENV"
          echo "解析到版本 v${VERSION}"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "AfyzHub-${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afyzhub-release
          path: AfyzHub-${{ env.APP_VERSION }}.apk

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AFYZFUR_PAT }}
        run: |
          # 发行说明写入文件再引用，避免在 YAML 中内嵌多行字符串破坏缩进。
          {
            printf 'AfyzHub 开发预览版 %s。此版本用于测试，可能存在未完成的功能。\n\n' "$APP_VERSION"
            printf '本次更新内容见 [CHANGELOG.md](%s)。\n' \
              "https://github.com/afyzfur/afyzhub/blob/main/CHANGELOG.md"
          } > release-notes.md
          # 同名发行版存在时只覆盖附件与说明，不删除发行版和标签，
          # 避免历史版本连同标签一起丢失。
          if gh release view "$APP_VERSION" >/dev/null 2>&1; then
            echo "发行版 $APP_VERSION 已存在，更新附件与说明"
            gh release edit "$APP_VERSION" \
              --title "$APP_VERSION" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$APP_VERSION" \
              "AfyzHub-${APP_VERSION}.apk" --clobber
          else
            gh release create "$APP_VERSION" \
              --title "$APP_VERSION" \
              --notes-file release-notes.md \
              --prerelease \
              --target main \
              "AfyzHub-${APP_VERSION}.apk"
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/afyzhub.jks"
