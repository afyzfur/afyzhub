name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: v0.1.3-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Show failing test details
        if: failure()
        run: |
          # 直接打印 XML 报告里的失败原因，避免另外下载报告。
          find app/build/test-results -name '*.xml' -print0 |
            xargs -0 grep -l '<failure' |
            while read -r f; do
              echo "===== $f ====="
              sed -n 's/.*<testcase name="\([^"]*\)".*/CASE: \1/p;/<failure/,/<\/failure>/p' "$f" | head -40
            done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/afyzhub.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/afyzhub.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "AfyzHub-${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afyzhub-release
          path: AfyzHub-${{ env.APP_VERSION }}.apk

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AFYZFUR_PAT }}
        run: |
          # 发行说明写入文件再引用，避免在 YAML 中内嵌多行字符串破坏缩进。
          {
            printf 'AfyzHub 开发预览版 %s。此版本用于测试，可能存在未完成的功能。\n\n' "$APP_VERSION"
            printf '本次更新内容见 [CHANGELOG.md](%s)。\n' \
              "https://github.com/afyzfur/afyzhub/blob/main/CHANGELOG.md"
          } > release-notes.md
          gh release delete "$APP_VERSION" --yes --cleanup-tag || true
          gh release create "$APP_VERSION" \
            --title "$APP_VERSION" \
            --notes-file release-notes.md \
            --prerelease \
            --target main \
            "AfyzHub-${APP_VERSION}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/afyzhub.jks"
