build:
  maxIssues: 0
config:
  validation: true
  warningsAsErrors: true
potential-bugs:
  active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  ThrowsCount:
    active: false
  UseCheckOrError:
    active: true
  StringLiteralDuplication:
    active: false
complexity:
  active: true
  LongMethod:
    active: false
  LongParameterList:
    active: false
  ComplexCondition:
    active: false
  TooManyFunctions:
    active: false
naming:
  active: true
  # Compose @Composable functions intentionally use PascalCase.
  FunctionNaming:
    active: false
  VariableNaming:
    active: true
